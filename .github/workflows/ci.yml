name: Android CI
on:
  push:
    branches: [Java_8]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '11', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '7.5'}
      - run: gradle testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: java-8-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
