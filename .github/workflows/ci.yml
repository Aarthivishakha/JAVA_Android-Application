name: Android CI
on:
  push:
    branches: [Java_11]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '11', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '7.5'}
      - run: gradle testDebugUnitTest assembleDebug lintDebug
